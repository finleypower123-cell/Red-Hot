name: Build PEPPER (macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DPEPPER_BUILD_TESTS=ON

      - name: Build VST3, AU and AAX
        run: cmake --build build --parallel

      - name: Run DSP tests
        run: ./build/tests/PepperDspTests_artefacts/Release/PepperDspTests

      - name: Run plug-in tests (+ GUI screenshot)
        run: ./build/tests/PepperPluginTests_artefacts/Release/PepperPluginTests "$RUNNER_TEMP/pepper_gui"

      - name: Ad-hoc sign bundles
        run: |
          ART=build/Pepper_artefacts/Release
          for b in "$ART/VST3/PEPPER.vst3" "$ART/AU/PEPPER.component" "$ART/AAX/PEPPER.aaxplugin"; do
            if [ -d "$b" ]; then codesign --force --deep --sign - "$b"; fi
          done

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Pepper_artefacts/Release/AU/PEPPER.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -strict -v aufx Ppr1 Rhot

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate build/Pepper_artefacts/Release/VST3/PEPPER.vst3

      - name: Package
        if: always()
        run: |
          ART=build/Pepper_artefacts/Release
          mkdir -p dist/PEPPER
          if [ -d "$ART/VST3/PEPPER.vst3" ]; then cp -R "$ART/VST3/PEPPER.vst3" dist/PEPPER/; fi
          if [ -d "$ART/AU/PEPPER.component" ]; then cp -R "$ART/AU/PEPPER.component" dist/PEPPER/; fi
          if [ -d "$ART/AAX/PEPPER.aaxplugin" ]; then cp -R "$ART/AAX/PEPPER.aaxplugin" dist/PEPPER/; fi
          cp "packaging/Install PEPPER.command" dist/PEPPER/
          cp README.md dist/PEPPER/README.md
          # Double-click installer: VST3 + AU + AAX (Pro Tools folder)
          ROOT=dist/pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" \
                   "$ROOT/Library/Application Support/Avid/Audio/Plug-Ins"
          if [ -d "$ART/VST3/PEPPER.vst3" ]; then cp -R "$ART/VST3/PEPPER.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"; fi
          if [ -d "$ART/AU/PEPPER.component" ]; then cp -R "$ART/AU/PEPPER.component" "$ROOT/Library/Audio/Plug-Ins/Components/"; fi
          if [ -d "$ART/AAX/PEPPER.aaxplugin" ]; then cp -R "$ART/AAX/PEPPER.aaxplugin" "$ROOT/Library/Application Support/Avid/Audio/Plug-Ins/"; fi
          pkgbuild --analyze --root "$ROOT" dist/components.plist
          n=$(/usr/libexec/PlistBuddy -c "Print" dist/components.plist | grep -c "BundleIsRelocatable" || true)
          for i in $(seq 0 $((n - 1))); do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" dist/components.plist
          done
          pkgbuild --root "$ROOT" --component-plist dist/components.plist --identifier com.redhot.pepper \
                   --version 1.0.0 --install-location / "dist/PEPPER/Install PEPPER.pkg"
          if [ -f "$RUNNER_TEMP/pepper_gui_1.png" ]; then cp "$RUNNER_TEMP/pepper_gui_1.png" dist/PEPPER/screenshot.png; fi
          cd dist && ditto -c -k --keepParent PEPPER PEPPER-macOS.zip

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEPPER-macOS
          path: dist/PEPPER-macOS.zip

      - name: Save build to the 'builds' branch (direct download link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/branch && cd dist/branch
          git init -q
          git checkout -q -b builds
          cp ../PEPPER-macOS.zip .
          printf '# PEPPER builds\n\nLatest macOS build of `main` (%s): [PEPPER-macOS.zip](PEPPER-macOS.zip)\n' "${GITHUB_SHA::7}" > README.md
          git add PEPPER-macOS.zip README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "PEPPER macOS build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PEPPER-macOS.zip
